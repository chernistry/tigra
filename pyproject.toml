[project]
name = "tigra"
dynamic = ["version"]
description = "Turn your LinkedIn data export into an offline, interactive graph of your network."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,!=3.14.1"
dependencies = [
    "duckdb==1.5.6",
    "networkx==3.7",
]
keywords = ["network", "graph", "data-export", "offline", "visualization"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.scripts]
tigra = "tigra.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.8",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tigra/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E731"]  # small named lambdas read better than one-line defs here
allowed-confusables = ["×", "–", "·", "→"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # literal CSV rows read best unwrapped
