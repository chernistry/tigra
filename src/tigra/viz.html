}

}

* { box-sizing: border-box; }

<body>
<header>
  <button id="menu-btn" class="only-narrow" aria-label="Show controls" aria-expanded="false" aria-controls="side">☰</button>
  <h1>Network graph</h1>
  <span id="stats" class="muted"></span>
  <div class="seg" role="radiogroup" aria-label="View mode" id="modes">
    <button role="radio" data-mode="clusters" aria-checked="true">Constellations</button>
    <button role="radio" data-mode="companies" aria-checked="false">Companies</button>
    <button role="radio" data-mode="radar" aria-checked="false">Interaction</button>
    <button role="radio" data-mode="timeline" aria-checked="false">Timeline</button>
    <button role="radio" data-mode="cohorts" aria-checked="false">Cohorts</button>
  </div>
  <button id="table-btn" aria-pressed="false">Table</button>
  <span class="spacer"></span>
  <div class="search">
    <input id="q" type="search" placeholder="Search name, company, role  ( / )" aria-label="Search contacts"
      autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results">
    <ul id="results" role="listbox" aria-label="Search results" hidden></ul>
  </div>
</header>
<main>
  <aside id="side" aria-label="Controls">
    <section>
      <h2>Colour by</h2>
      <div class="seg" role="radiogroup" aria-label="Colour by" id="color-by">
        <button role="radio" data-color="community" aria-checked="true">Community</button>
        <button role="radio" data-color="domain" aria-checked="false">Domain</button>
        <button role="radio" data-color="cohort" aria-checked="false">Cohort</button>
      </div>
      <ul id="legend"></ul>
      <div class="row"><button class="link" id="legend-all">Show all</button><button class="link" id="legend-none">Hide all</button></div>
    </section>
    <section>
      <h2>Filters</h2>
      <label><input type="checkbox" id="f-dm"> Only contacts with messages</label>
      <label><input type="checkbox" id="f-ego" checked> Ego hub (you and your ties)</label>
      <label><input type="checkbox" id="f-colleague" checked> Colleague edges (inferred)</label>
      <label><input type="checkbox" id="f-role" checked> Similar-role edges (inferred)</label>
      <label><input type="checkbox" id="f-coactive" checked> Co-active DM edges (inferred)</label>
      <label class="col">Connected up to <output id="cutoff-out" class="muted"></output>
        <input type="range" id="cutoff" min="0" max="1000" value="1000" aria-label="Connected up to date"></label>
      <div class="row"><button id="play">▶ Play growth</button></div>
    </section>
    <section>
      <h2>Physics</h2>
      <label class="col">Repulsion <input type="range" id="p-charge" min="5" max="150" value="45"></label>
      <label class="col">Link strength <input type="range" id="p-link" min="0" max="100" value="30"></label>
      <label class="col">Group gravity <input type="range" id="p-gravity" min="0" max="100" value="40"></label>
      <div class="row"><button id="reheat">Reheat</button><button id="fit">Fit</button><button id="png">Export PNG</button></div>
    </section>
    <section class="note muted" id="note"></section>
  </aside>
  <div id="stage">
    <canvas id="c" role="img" aria-label="Network graph of your connections. Use search, the legend or the Table view to explore."></canvas>
    <div id="tip" hidden></div>
    <div id="table-wrap" hidden></div>
  </div>
  <aside id="inspector" aria-live="polite" aria-label="Contact details" hidden></aside>
</main>
<script type="application/json" id="graph-data">__GRAPH_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("graph-data").textContent);
const PALETTE = {
  light: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"],
  dark: ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#0ca30c", "#9085e9", "#e66767"],
};
const $ = (id) => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d"), stage = $("stage");
const ME = "__me";

// ---------- data ----------
const nodes = DATA.nodes.map((d) => ({ ...d, x: 0, y: 0, vx: 0, vy: 0, fx: null, fy: null,
  dmTotal: d.dm.sent + d.dm.recv, t: d.connected ? Date.parse(d.connected) : null }));
const byId = new Map(nodes.map((n) => [n.id, n]));
const me = { id: ME, name: "You", isMe: true, x: 0, y: 0 };
const edges = DATA.edges.map((e) => ({ ...e, a: byId.get(e.s), b: byId.get(e.t) })).filter((e) => e.a && e.b);
const orgName = new Map(DATA.orgs.map((o) => [o.id, o.name]));
const commLabel = new Map(DATA.communities.map((c) => [c.id, c.label]));
const COHORTS = DATA.cohorts || [], REGIMES = DATA.regimes || [];
const cohortLabel = new Map(COHORTS.map((c) => [c.id, c.label]));
const adj = new Map(nodes.map((n) => [n.id, { colleague: [], role: [], coactive: [] }]));
for (const e of edges) { adj.get(e.s)[e.kind].push(e.b); adj.get(e.t)[e.kind].push(e.a); }
const fold = (s) => (s || "").normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
for (const n of nodes) n.hay = fold(`${n.name} ${n.position} ${n.company}`);
const maxWarmth = Math.max(1e-9, ...nodes.map((n) => n.warmth));
const maxPr = Math.max(1e-9, ...nodes.map((n) => n.pagerank));
const rank = (key) => { const m = new Map(); [...nodes].sort((a, b) => b[key] - a[key]).forEach((n, i) => m.set(n.id, i + 1)); return m; };
const prRank = rank("pagerank"), btRank = rank("betweenness");
const dated = nodes.filter((n) => n.t !== null).map((n) => n.t);
const tMin = dated.length ? Math.min(...dated) : 0, tMax = dated.length ? Math.max(...dated) : 1;

// Categories: colour slots are assigned once, from the full data, by size. Filters never repaint.
function buildCategories(kind) {
  const counts = new Map();
  for (const n of nodes) { const k = rawKey(kind, n); counts.set(k, (counts.get(k) || 0) + 1); }
  const numeric = kind !== "domain", special = numeric ? [-1] : ["Other", "Unknown"];
  const ranked = [...counts.entries()].filter(([k]) => !special.includes(k)).sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
  const cats = [], slotOf = new Map();
  const labelOf = (k) => kind === "community" ? commLabel.get(k) || `Group ${k + 1}` : kind === "cohort" ? cohortLabel.get(k) || `Cohort ${k + 1}` : k;
  ranked.slice(0, 8).forEach(([k, c], i) => { slotOf.set(k, i); cats.push({ key: String(k), slot: i, count: c, label: labelOf(k) }); });
  const rest = ranked.slice(8).reduce((s, [, c]) => s + c, 0) + (kind === "domain" ? (counts.get("Other") || 0) : 0);
  if (rest) cats.push({ key: "other", slot: -1, count: rest, label: { community: "Smaller groups", domain: "Other", cohort: "Smaller cohorts" }[kind] });
  const tail = numeric ? counts.get(-1) : counts.get("Unknown");
  if (tail) cats.push({ key: "none", slot: -2, count: tail, label: { community: "No inferred ties", domain: "Unknown", cohort: "Not in a burst" }[kind] });
  return { cats, slotOf };
}
function rawKey(kind, n) { return kind === "community" ? n.community : kind === "cohort" ? n.cohort : n.domain; }
const CATS = { community: buildCategories("community"), domain: buildCategories("domain"), cohort: buildCategories("cohort") };
function catKey(n, kind = state.colorBy) {
  const k = rawKey(kind, n), { slotOf } = CATS[kind];
  if (slotOf.has(k)) return String(k);
  if (kind === "domain" ? k === "Unknown" : k === -1) return "none";
  return "other";
}

// ---------- state ----------
const state = { mode: "clusters", colorBy: "community", hidden: { community: new Set(), domain: new Set(), cohort: new Set() },
  onlyDm: false, ego: true, colleague: true, role: true, coactive: true, cutoff: Infinity,
  charge: 45, link: 0.3, gravity: 0.4, selected: null, hover: null, legendHover: null, matches: null, table: false };
let theme = {}, visible = [], visEdges = [];
const timeAxis = () => state.mode === "timeline" || state.mode === "cohorts";
const cam = { x: 0, y: 0, k: 1 }; let camGoal = null, pendingFit = true, W = 0, H = 0, dpr = 1;
let alpha = 1, alphaTarget = 0, dirty = true;
const ALPHA_MIN = 0.003, ALPHA_DECAY = 1 - Math.pow(ALPHA_MIN, 1 / 320), VEL_DECAY = 0.55;

function readTheme() {
  const cs = getComputedStyle(document.documentElement), v = (n) => cs.getPropertyValue(n).trim();
  const dark = v("--scheme") === "dark";
  theme = { surface: v("--surface"), ink: v("--ink"), ink2: v("--ink-2"), muted: v("--muted"), grid: v("--grid"),
    axis: v("--axis"), series: dark ? PALETTE.dark : PALETTE.light, other: v("--syd-edge"), none: v("--syd-rule"),
    font: v("--syd-font-sans") || "system-ui, sans-serif" };
  dirty = true;
}
function colorOf(n) {
  if (n.isMe) return theme.ink;
  const k = catKey(n), cat = CATS[state.colorBy].cats.find((c) => c.key === k);
  if (!cat || cat.slot === -1) return theme.other;
  if (cat.slot === -2) return theme.none;
  return theme.series[cat.slot];
}
const colorCache = new Map();
function nodeColor(n) { if (!colorCache.has(n.id)) colorCache.set(n.id, colorOf(n)); return colorCache.get(n.id); }

function radius(n) {
  if (state.mode === "radar") return 3 + 2 * Math.sqrt(n.dmTotal);
  return 3 + 8 * Math.sqrt(n.pagerank / maxPr);
}

// ---------- visibility ----------
function applyFilters() {
  const hidden = state.hidden[state.colorBy];
  visible = nodes.filter((n) => !hidden.has(catKey(n)) && (!state.onlyDm || n.dmTotal > 0) &&
    (n.t === null || n.t <= state.cutoff));
  const vis = new Set(visible.map((n) => n.id));
  visEdges = edges.filter((e) => vis.has(e.s) && vis.has(e.t) && state[e.kind]);
  for (const n of nodes) n.deg = 0;
  for (const e of visEdges) { e.a.deg++; e.b.deg++; }
  for (const n of visible) n.r = radius(n);
  if (state.selected && !state.selected.isMe && !vis.has(state.selected.id)) select(null);
  $("stats").textContent = `${visible.length} of ${nodes.length} contacts · ${visEdges.length} inferred ties · as of ${DATA.meta.as_of || "—"}`;
  computeTargets();
  if (state.table) renderTable();
  dirty = true;
}

// ---------- layout targets per view mode ----------
let guides = { rings: [], hubs: [], years: [], lanes: [], regimes: [] };

  state.matches = new Set(resultNodes.map((n) => n.id)); resultIdx = -1;

    el("button", { type: "button", role: "option", id: `r${i}`, "aria-selected": "false", on: { click: () => pick(n) } },
      el("div", {}, n.name), el("div", { class: "sub" }, [n.position, n.company].filter(Boolean).join(" · "))))) :

// ---------- loop ----------
